name: Render screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Glide/**"
      - "scripts/**"
      - "VERSION"
      - ".github/workflows/screenshots.yaml"
  pull_request:
    paths:
      - "Glide/**"
      - "scripts/**"
      - "VERSION"
      - ".github/workflows/screenshots.yaml"

jobs:
  screenshots:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pillow
        shell: bash
        # Required by the menubar compositing step (and the PNG patch fallback).
        run: python3 -m pip install --upgrade Pillow || python3 -m pip install --break-system-packages --upgrade Pillow

      - name: Render screenshots
        shell: bash
        # Builds the real app with xcodebuild and renders the views via the hidden
        # --screenshot mode (see scripts/render-screenshots.sh + Glide/AppDelegate.swift).
        run: make screenshots

      - name: Show changes
        shell: bash
        run: git --no-pager diff --stat -- docs site

      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/drop-down.png
            docs/onboarding.png
            site/drop-down.png
            site/onboarding.png
            site/menubar.png
          if-no-files-found: error

      # On main / manual runs, propose the refreshed screenshots as a PR. Direct pushes
      # to main are blocked by branch protection, so we open a PR instead.
      - name: Open PR with refreshed screenshots
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Refresh screenshots for v${{ github.sha }}"
          branch: automation/refresh-screenshots
          delete-branch: true
          title: "Refresh app screenshots"
          body: |
            Automated refresh of the docs/site screenshots, rendered from the real
            app views by the macOS `Render screenshots` workflow.

            Triggered by ${{ github.event_name }} on `${{ github.ref_name }}`.
          add-paths: |
            docs/drop-down.png
            docs/onboarding.png
            site/drop-down.png
            site/onboarding.png
            site/menubar.png
